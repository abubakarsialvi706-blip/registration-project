<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTERATION FORM</title>
</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <form>
        <br/>
        <label for ="full name">full name:</label>
        <input type="text" id="full name">
        <br><br>
        <label for="Email">Email:</label>
        <input type="Email"id="Email">
        <br><br>
        <label for="password">password:</label>
        <input type="password" id="password">
        <br><br>
        <label for="phone">phone number:</label>
        <input type="tel" id="phone">
        <label for="dob">Date of Birth:</label>
        <input type="date"id="dob"> 
        <br>
        <h3>
            <label>Gender:</label><br>
        </h3>
        <input type="radio" name="Gender"id="male">
        <label for="male">male</label>
        <input type="radio" name="Gender"id="female">
        <label for="female">female</label>
            <input type="radio"name="Gender"id="other">
            <label for="other">other</label>
            <br>
            <h3>
                <label>Program:</label>
            </h3>
            <br>
            <input type="radio"name="Program"id="computer_science">
            <label for="computer_science">Computer science</label>
            <input type="radio"name="Program"id="Artificial_intelligence">
            <label for="Artificial_intelligence">Artificial_intelligence</label>
            <input type="radio"name="Program"id="software Engineering">
            <label for="Software Engineering">Software Engineering</label>
                <h3>
                    <label>Skils:</label>
                </h3>
            <input type="checkbox" name="skills" id="HTML">
            <label for="HTML">HTML</label>
            <input type="checkbox" name="skills" id="CSS">
            <label for="CSS">CSS</label>
            <input type="checkbox" name="skills" id="JAVA_SCRIPT">
            <label for="JAVA_SCRIPT">JAVA_SCRIPT</label>
            <input type="checkbox" name="skills" id="PYTHON">
            <label for="PYTHON">PYTHON</label>
            <br><br>
            <label for="City">City</label>
            <select id="City" name="City">City
                <option value="lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
                <option value="Islamabad">Islamabad</option>
            </select>
            <br><br>
            <label for="Address">Address</label>
            <textarea id="Address"name="Adress"row="4"col="30"></textarea>
            <button type="submit">Register</button>
